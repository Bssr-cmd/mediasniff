<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MediaSniff Downloader</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f0f13; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: #1c1c24; padding: 30px; border-radius: 12px; text-align: center; width: 400px; }
    .progress-bar { width: 100%; height: 12px; background: #2a2a35; border-radius: 6px; margin: 20px 0; overflow: hidden; }
    .progress-fill { height: 100%; background: #4caf50; width: 0%; transition: width 0.2s; }
    .status { font-size: 14px; color: #aaa; }
    h2 { margin-top: 0; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Downloading Media</h2>
    <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
    <div class="status" id="status">Waiting for file access...</div>
  </div>
  <script type="module" src="downloader.js"></script>
</body>
</html>
