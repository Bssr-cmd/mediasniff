<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediaSniff</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header -->
  <header class="header" id="header">
    <div class="header-left">
      <div class="logo" id="logo">
        <svg width="24" height="24" viewBox="0 0 28 28" fill="none">
          <defs>
            <linearGradient id="logoGrad" x1="0" y1="0" x2="28" y2="28">
              <stop offset="0%" stop-color="#6366f1"/>
              <stop offset="100%" stop-color="#a855f7"/>
            </linearGradient>
          </defs>
          <rect width="28" height="28" rx="7" fill="url(#logoGrad)"/>
          <path d="M8 10.5C8 9.67 8.67 9 9.5 9H12L14 11H18.5C19.33 11 20 11.67 20 12.5V17.5C20 18.33 19.33 19 18.5 19H9.5C8.67 19 8 18.33 8 17.5V10.5Z" fill="white" opacity="0.9"/>
          <circle cx="20" cy="9" r="3" fill="#22d3ee" stroke="#6366f1" stroke-width="1.5"/>
          <path d="M19 9L20.5 9.8V8.2L19 9Z" fill="#6366f1"/>
        </svg>
      </div>
      <div class="header-text">
        <h1 class="header-title" id="headerTitle">MediaSniff</h1>
        <p class="header-subtitle" id="headerSubtitle">Detecting media...</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="scanBtn" title="Force Scan" aria-label="Force scan">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12a10 10 0 1 0 10-10v0"/><path d="M12 2v4"/><path d="M12 8a4 4 0 1 0 4 4"/></svg>
      </button>
      <button class="icon-btn" id="clearBtn" title="Clear all" aria-label="Clear detected media">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3,6 5,6 21,6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
        </svg>
      </button>
      <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Filter / Search Bar (Clean) -->
  <div class="filter-bar" id="filterBar" style="display: none;">
  </div>

  <!-- Settings Panel -->
  <div class="settings-panel" id="settingsPanel">
    <div class="setting-row">
      <label class="setting-label" for="minSizeFilter">Min file size</label>
      <select class="setting-select" id="minSizeFilter">
        <option value="0">No minimum</option>
        <option value="50000">50 KB</option>
        <option value="500000">500 KB</option>
        <option value="1000000">1 MB</option>
        <option value="5000000">5 MB</option>
      </select>
    </div>
    <div class="setting-row">
      <label class="setting-label" for="qualityPref">Preferred quality</label>
      <select class="setting-select" id="qualityPref">
        <option value="highest">Highest</option>
        <option value="1080p">1080p</option>
        <option value="720p">720p</option>
        <option value="lowest">Lowest</option>
      </select>
    </div>
    <div class="setting-row">
      <label class="setting-label" for="advancedToggle">Enable advanced features</label>
      <input type="checkbox" id="advancedToggle" class="setting-checkbox" />
    </div>
  </div>

  <!-- Media List -->
  <main class="media-list" id="mediaList">
    <!-- Media cards rendered by JS -->
  </main>

  <!-- Empty State -->
  <div class="empty-state" id="emptyState">
    <div class="empty-icon">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted);"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
    </div>
    <p class="empty-title">No media detected</p>
    <p class="empty-desc">Browse a page with video or audio content.<br>MediaSniff will automatically detect it.</p>
    <div class="empty-hint">Try refreshing the page (Ctrl+Shift+R) to re-detect media.</div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Footer Troubleshooting -->
  <footer class="footer" id="footer" style="padding: 8px; text-align: center; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-muted);">
    Try refreshing the page (Ctrl+Shift+R) to re-detect media.
  </footer>

  <script src="popup.js"></script>
</body>
</html>
